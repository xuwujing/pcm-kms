spring:
  application:
    name: pcm-kms-server
  profiles:
    active: sqlite
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true

server:
  port: 8080

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

kms:
  datasource:
    mode: sqlite
  cache:
    type: local
  security:
    strict-sign: false
    request-expire-seconds: 300

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.pcm.kms: DEBUG
