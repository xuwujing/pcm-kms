spring:
  application:
    name: pcm-kms-server
  profiles:
    active: sqlite
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

mybatis-plus:
  global-config:
    db-config:
      table-prefix: kms_
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# KMS 业务配置
kms:
  security:
    strict-sign: false
    request-expire-seconds: 300
  ratelimit:
    enabled: true
    max-per-minute: 60

knife4j:
  enable: true
  setting:
    language: zh_cn

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid

logging:
  level:
    com.pcm.kms: DEBUG
