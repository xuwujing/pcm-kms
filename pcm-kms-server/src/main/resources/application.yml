spring:
  application:
    name: pcm-kms-server
  profiles:
    active: sqlite
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

mybatis-plus:
  global-config:
    db-config:
      table-prefix: kms_
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# KMS 业务配置
kms:
  security:
    strict-sign: false               # 是否严格校验客户端签名（开发环境建议关闭，生产必须开启）
    request-expire-seconds: 300       # 请求过期时间（秒），防止重放攻击
  ratelimit:
    enabled: true                     # 是否启用接口限流
    max-per-minute: 60                # 每个 IP/clientId 每分钟最大请求数
  cors:
    allowed-origins: "*"              # 允许的跨域域名，多个用英文逗号分隔，如: http://localhost:5173,https://xxx.com

knife4j:
  enable: true
  setting:
    language: zh_cn

# Sa-Token 配置
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid

logging:
  level:
    com.pcm.kms: DEBUG
